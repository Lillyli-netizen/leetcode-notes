<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1480. 一维数组的动态和 · 执行过程</title>
<style>
:root{
  --font-sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --surface:#ffffff;
  --surface-muted:#f5f7f9;
  --border:#e2e6ea;
  --text:#1b2126;
  --text-muted:#68727d;
  --brand:#16a34a;
  --brand-soft:rgba(22,163,74,0.10);
  --brand-text:#12703a;
  --radius:8px;
  --radius-card:12px;
  --spacer-4:4px;
  --spacer-8:8px;
  --spacer-12:12px;
  --spacer-16:16px;
  --spacer-24:24px;
  --text-caption:12px;
  --text-code:13px;
  --text-body:14px;
  --text-title:16px;
  --weight-medium:500;
  --weight-strong:600;
}
body{
  margin:0;
  padding:var(--spacer-24) var(--spacer-16);
  background:#fafbfc;
  color:var(--text);
  font-family:var(--font-sans);
  display:flex;
  justify-content:center;
}
.wrap{width:100%;max-width:760px;}
h1{font:var(--weight-medium) 20px/28px var(--font-sans);margin:0 0 var(--spacer-16);}
.rs-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:var(--spacer-16);box-sizing:border-box;}
.rs-hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--spacer-12);margin-bottom:var(--spacer-12);}
.rs-ttl{font:var(--weight-medium) var(--text-title) var(--font-sans);}
.rs-no{font:var(--text-caption) var(--font-sans);color:var(--text-muted);}
.rs-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--spacer-16);align-items:start;}
.rs-pane{background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius);padding:var(--spacer-12);}
.rs-pt{font:var(--text-caption) var(--font-sans);color:var(--text-muted);margin-bottom:var(--spacer-8);}
.rs-ln{display:flex;gap:var(--spacer-8);font-family:var(--font-mono);font-size:var(--text-code);line-height:20px;padding:1px var(--spacer-4);border-radius:4px;white-space:pre;transition:background 160ms ease;}
.rs-ln .no{color:var(--text-muted);width:14px;text-align:right;flex:none;}
.rs-ln .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;}
.rs-ln.on{background:var(--brand-soft);}
.rs-ln.on .tx{color:var(--brand-text);font-weight:var(--weight-strong);}
.rs-row{display:flex;align-items:center;gap:var(--spacer-8);margin-bottom:var(--spacer-8);}
.rs-lbl{font:var(--text-caption) var(--font-sans);color:var(--text-muted);width:34px;flex:none;}
.rs-cells{display:flex;gap:6px;}
.rs-c{width:30px;height:30px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:var(--text-code);color:var(--text);transition:all 160ms ease;}
.rs-c.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text);font-weight:var(--weight-strong);}
.rs-c.empty{border-style:dashed;color:transparent;}
.rs-x{font-family:var(--font-mono);font-size:var(--text-title);color:var(--brand-text);font-weight:var(--weight-strong);min-width:24px;}
.rs-total{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:var(--spacer-8);margin-top:var(--spacer-4);margin-bottom:var(--spacer-12);}
.rs-total .rs-lbl{width:auto;}
.rs-eq{font-family:var(--font-mono);font-size:var(--text-body);margin-top:var(--spacer-4);}
.rs-eq .prev{color:var(--text-muted);}
.rs-eq .cur{color:var(--brand-text);font-weight:var(--weight-strong);}
.rs-eq .new{color:var(--text);font-weight:var(--weight-strong);}
.rs-cap{margin-top:var(--spacer-12);font:var(--text-body) var(--font-sans);line-height:20px;min-height:40px;}
.rs-ctrls{display:flex;gap:var(--spacer-8);margin-top:var(--spacer-8);}
.rs-ctrls button{font:var(--text-caption) var(--font-sans);color:var(--text);background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius);padding:6px 14px;cursor:pointer;}
.rs-ctrls button:hover{border-color:var(--brand);}
.rs-ctrls button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
@media (max-width:560px){.rs-grid{grid-template-columns:minmax(0,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <h1>1480. 一维数组的动态和 · 执行过程</h1>
  <div class="rs-card">
    <div class="rs-hd">
      <span class="rs-ttl">代码和内存同时看</span>
      <span class="rs-no" id="no">1 / 6</span>
    </div>
    <div class="rs-grid">
      <div class="rs-pane">
        <div class="rs-pt">代码</div>
        <div id="code">
          <div class="rs-ln" data-l="1"><span class="no">1</span><span class="tx">def runningSum(self, nums):</span></div>
          <div class="rs-ln" data-l="2"><span class="no">2</span><span class="tx">    result = []</span></div>
          <div class="rs-ln" data-l="3"><span class="no">3</span><span class="tx">    total = 0</span></div>
          <div class="rs-ln" data-l="4"><span class="no">4</span><span class="tx">    for x in nums:</span></div>
          <div class="rs-ln" data-l="5"><span class="no">5</span><span class="tx">        total = total + x</span></div>
          <div class="rs-ln" data-l="6"><span class="no">6</span><span class="tx">        result.append(total)</span></div>
          <div class="rs-ln" data-l="7"><span class="no">7</span><span class="tx">    return result</span></div>
        </div>
      </div>
      <div class="rs-pane">
        <div class="rs-pt">内存</div>
        <div class="rs-row">
          <span class="rs-lbl">nums</span>
          <span class="rs-cells" id="nums">
            <span class="rs-c" data-i="0">1</span>
            <span class="rs-c" data-i="1">2</span>
            <span class="rs-c" data-i="2">3</span>
            <span class="rs-c" data-i="3">4</span>
          </span>
        </div>
        <div class="rs-row"><span class="rs-lbl">x</span><span class="rs-x" id="x">—</span></div>
        <div class="rs-total">
          <span class="rs-lbl">total</span>
          <div class="rs-eq" id="total">0</div>
        </div>
        <div class="rs-row">
          <span class="rs-lbl">result</span>
          <span class="rs-cells" id="out">
            <span class="rs-c empty" data-i="0"></span>
            <span class="rs-c empty" data-i="1"></span>
            <span class="rs-c empty" data-i="2"></span>
            <span class="rs-c empty" data-i="3"></span>
          </span>
        </div>
      </div>
    </div>
    <div class="rs-cap" id="cap">先准备好两个变量：result 是空列表，total 从 0 开始。</div>
    <div class="rs-ctrls">
      <button type="button" id="prev">上一步</button>
      <button type="button" id="next">下一步</button>
      <button type="button" id="play">暂停</button>
    </div>
  </div>
</div>
<script>
(function(){
  var steps=[
    {lines:[2,3],at:-1,x:null,prev:null,total:0,res:[null,null,null,null],cap:'先准备好两个变量：result 是空列表，total 从 0 开始。'},
    {lines:[4,5,6],at:0,x:1,prev:0,total:1,res:[1,null,null,null],cap:'第 1 轮：x 取出 1，total = 上一轮的 0 + 1，把 1 追加到 result。'},
    {lines:[4,5,6],at:1,x:2,prev:1,total:3,res:[1,3,null,null],cap:'第 2 轮：x 取出 2，total = 上一轮的 1 + 2。那个 1 是上一轮留下的。'},
    {lines:[4,5,6],at:2,x:3,prev:3,total:6,res:[1,3,6,null],cap:'第 3 轮：x 取出 3，total = 上一轮的 3 + 3。'},
    {lines:[4,5,6],at:3,x:4,prev:6,total:10,res:[1,3,6,10],cap:'第 4 轮：x 取出 4，total = 上一轮的 6 + 4。'},
    {lines:[7],at:-1,x:null,prev:null,total:10,res:[1,3,6,10],cap:'nums 遍历完了，循环结束，函数返回 result。'}
  ];
  var i=0,timer=null;
  var capEl=document.getElementById('cap');
  var totalEl=document.getElementById('total');
  var xEl=document.getElementById('x');
  var noEl=document.getElementById('no');
  var lines=document.querySelectorAll('.rs-ln');
  var nums=document.querySelectorAll('#nums .rs-c');
  var outs=document.querySelectorAll('#out .rs-c');
  var playBtn=document.getElementById('play');
  function render(){
    var s=steps[i],k;
    for(k=0;k<lines.length;k++){
      var n=parseInt(lines[k].getAttribute('data-l'),10);
      lines[k].classList.toggle('on',s.lines.indexOf(n)>-1);
    }
    for(k=0;k<nums.length;k++){nums[k].classList.toggle('on',s.at===k);}
    for(k=0;k<outs.length;k++){
      var v=s.res[k];
      outs[k].classList.toggle('empty',v===null);
      outs[k].textContent=(v===null?'':String(v));
    }
    xEl.textContent=(s.x===null?'—':String(s.x));
    if(s.prev===null){totalEl.textContent=String(s.total);}
    else{totalEl.innerHTML='<span class="prev">'+s.prev+'</span> + <span class="cur">'+s.x+'</span> = <span class="new">'+s.total+'</span>';}
    capEl.textContent=s.cap;
    noEl.textContent=(i+1)+' / '+steps.length;
  }
  function move(d){i=(i+d+steps.length)%steps.length;render();}
  function start(){if(timer)return;timer=setInterval(function(){move(1);},2600);playBtn.textContent='暂停';}
  function stop(){clearInterval(timer);timer=null;playBtn.textContent='播放';}
  document.getElementById('next').addEventListener('click',function(){move(1);});
  document.getElementById('prev').addEventListener('click',function(){move(-1);});
  playBtn.addEventListener('click',function(){if(timer){stop();}else{start();}});
  render();
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){playBtn.textContent='播放';}else{start();}
})();
</script>
</body>
</html>
